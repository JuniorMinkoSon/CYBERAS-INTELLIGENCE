# Déploiement du backend CYBERAS sur Render (offre gratuite).
# Le frontend n'est pas décrit ici : il est déployé sur Vercel, qui sert le
# build statique depuis son CDN sans démarrage à froid.
#
# ATTENTION — limites du plan gratuit, à connaître avant toute démonstration :
#   - la base PostgreSQL gratuite EXPIRE 30 JOURS après sa création, puis est
#     supprimée passé un délai de grâce de 14 jours ;
#   - le service web s'endort après 15 minutes sans trafic et met environ une
#     minute à se réveiller. La première requête après une pause est donc lente.

services:
  - name: cyberas-api
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /q/health/ready
    envVars:
      # Coordonnées de la base. docker-entrypoint.sh en compose l'URL JDBC.
      - key: DB_HOST
        fromDatabase:
          name: cyberas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cyberas-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: cyberas-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: cyberas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cyberas-db
          property: password

      # Redis (Key Value). Le format « redis://hôte:port » convient tel quel
      # à la propriété quarkus.redis.hosts.
      - key: REDIS_HOSTS
        fromService:
          type: keyvalue
          name: cyberas-keyvalue
          property: connectionString

      # Secret de signature des jetons, tiré au sort par Render et jamais
      # présent dans le dépôt.
      - key: JWT_SECRET
        generateValue: true

      # Origines autorisées : le frontend Vercel appelle depuis un autre domaine
      # que l'API, le CORS est donc indispensable. À renseigner dans le tableau
      # de bord Render avec l'URL Vercel exacte, une fois celle-ci connue.
      - key: CORS_ORIGINS
        sync: false

      # --- Limites de débit : valeurs assouplies pour la PHASE DE TEST ---
      #
      # Les valeurs par défaut du code (5 connexions par quart d'heure, 3
      # inscriptions par heure) protègent une production mais rendent les essais
      # impraticables : plusieurs testeurs derrière une même sortie internet
      # partagent la même adresse IP et se bloquent mutuellement, avec un 429 que
      # l'interface ne sait pas expliquer clairement.
      #
      # À RESSERRER AVANT LA MISE EN PRODUCTION. La limite de connexion est la
      # seule protection contre les attaques par force brute sur les mots de
      # passe : la porter à 60 essais par quart d'heure rend une telle attaque
      # nettement plus praticable. Les bornes restent volontairement finies,
      # plutôt que désactivées, pour continuer d'absorber un emballement.
      - key: RATE_LIMIT_LOGIN_MAX
        value: "60"
      - key: RATE_LIMIT_LOGIN_WINDOW
        value: "900"
      - key: RATE_LIMIT_REGISTER_MAX
        value: "60"
      - key: RATE_LIMIT_REGISTER_WINDOW
        value: "3600"
      - key: RATE_LIMIT_API_MAX
        value: "1000"
      - key: RATE_LIMIT_API_WINDOW
        value: "60"

  - name: cyberas-keyvalue
    type: keyvalue
    plan: free
    region: frankfurt
    # Seuls les services Render du même compte doivent joindre le cache :
    # aucune plage publique n'est autorisée.
    ipAllowList: []

databases:
  - name: cyberas-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
