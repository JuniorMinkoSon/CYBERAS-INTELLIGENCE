<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYBERAS Intelligence : pilotez votre cybersécurité</title>

    <!--
      Aperçu de partage.

      Sans ces balises, un lien collé dans WhatsApp, LinkedIn, Slack ou un
      courriel n'affichait que l'adresse brute : ni marque, ni phrase, rien qui
      dise de quoi il s'agit. Le destinataire devait cliquer pour savoir, et
      c'est précisément ce qu'on lui demande de ne pas faire.

      Les valeurs sont posées ici et non par page : le site est une application
      monopage, toutes les routes servent ce même document, et les robots des
      messageries ne lisent pas le JavaScript. Un aperçu par page demanderait un
      rendu côté serveur ou une pré-génération ; celui-ci vaut pour le site
      entier, ce qui est le cas d'usage réel — on partage l'adresse du site.

      `og:url` n'est pas figé : l'hébergement de démonstration et le domaine
      final ne portent pas la même adresse, et déclarer l'une des deux ferait
      pointer chaque aperçu vers l'autre. En son absence, les plateformes
      retiennent l'adresse effectivement partagée.

      `og:image` n'a pas ce choix : les robots des messageries ne résolvent pas
      les chemins relatifs, l'adresse doit être absolue. Elle porte donc le
      domaine de démonstration, et c'est LA LIGNE À CHANGER le jour de la mise
      en ligne sur le domaine définitif, faute de quoi les aperçus continueront
      d'aller chercher l'image sur l'hébergement de test.
    -->
    <meta
      name="description"
      content="La plateforme d'audit et de pilotage de la cybersécurité : un socle de contrôles unifié pour évaluer votre conformité, scanner vos vulnérabilités, mesurer votre maturité et suivre vos actions de remédiation."
    />
    <meta name="theme-color" content="#050C22" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CYBERAS Intelligence" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="CYBERAS Intelligence : pilotez votre cybersécurité" />
    <meta
      property="og:description"
      content="La plateforme d'audit et de pilotage de la cybersécurité : un socle de contrôles unifié pour évaluer votre conformité, scanner vos vulnérabilités, mesurer votre maturité et suivre vos actions de remédiation."
    />
    <meta property="og:image" content="https://cyberas-intelligence-delta.vercel.app/images/produit/hero-shield.jpg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta
      property="og:image:alt"
      content="Écusson CYBERAS Intelligence devant un globe numérique"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CYBERAS Intelligence : pilotez votre cybersécurité" />
    <meta
      name="twitter:description"
      content="La plateforme d'audit et de pilotage de la cybersécurité : un socle de contrôles unifié pour évaluer votre conformité, scanner vos vulnérabilités, mesurer votre maturité et suivre vos actions de remédiation."
    />
    <meta name="twitter:image" content="https://cyberas-intelligence-delta.vercel.app/images/produit/hero-shield.jpg" />
    <style>
      /* Premier affichage, avant que le script ne soit chargé : le même écusson
         que l'écran d'attente de l'application, remplacé dès que React monte. */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(640px 360px at 50% 40%, rgba(37,99,235,.10), transparent 70%), #fff; font-family: Inter, system-ui, sans-serif; color: #0F172A; }
      .boot-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: rgba(37,99,235,.12); overflow: hidden; }
      .boot-bar span { display: block; height: 100%; width: 34%; border-radius: 999px; background: linear-gradient(90deg, #2563EB, #0EA5E9); animation: boot-progress 1.15s cubic-bezier(.4,0,.2,1) infinite; }
      .boot svg { filter: drop-shadow(0 10px 24px rgba(37,99,235,.28)); }
      .boot-arc { transform-origin: 24px 24px; animation: boot-spin 1.4s cubic-bezier(.65,.05,.36,1) infinite; }
      .boot-word { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .06em; }
      .boot-word span { color: #2563EB; font-size: 12px; letter-spacing: .16em; margin-left: 6px; vertical-align: 2px; }
      @keyframes boot-progress { 0% { transform: translateX(-100%) } 60% { transform: translateX(160%) } 100% { transform: translateX(300%) } }
      @keyframes boot-spin { to { transform: rotate(360deg) } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-bar" aria-hidden="true"><span></span></div>
        <svg width="72" height="72" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M24 3L42 11v13c0 11.5-7.7 18.6-18 21C13.7 42.6 6 35.5 6 24V11L24 3z" fill="#fff" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" />
          <g class="boot-arc"><path d="M31 17.5A9.5 9.5 0 1 0 31 30.5" stroke="#DC2626" stroke-width="4" stroke-linecap="round" /></g>
        </svg>
        <p class="boot-word">CYBERAS <span>INTELLIGENCE</span></p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
