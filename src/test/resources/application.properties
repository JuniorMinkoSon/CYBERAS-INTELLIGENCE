# Configuration de test.
#
# Les Dev Services démarrent une PostgreSQL jetable via Testcontainers : les tests
# d'intégration s'exécutent contre le vrai moteur, migrations Flyway comprises,
# plutôt que contre une base en mémoire au comportement divergent.
# Requiert Docker. Les tests *IT sont exécutés par failsafe sur `mvn verify`.
quarkus.devservices.enabled=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:16-alpine

# Le schéma est produit par Flyway, comme en production : c'est ce qui rend les
# migrations réellement testées.
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=true

# Kafka et Redis ne sont pas requis par les tests actuels.
quarkus.kafka.devservices.enabled=false
quarkus.redis.devservices.enabled=false
mp.messaging.outgoing.finding-events.connector=smallrye-in-memory
mp.messaging.outgoing.risk-events.connector=smallrye-in-memory
mp.messaging.outgoing.audit-events.connector=smallrye-in-memory
mp.messaging.incoming.scan-events.connector=smallrye-in-memory

quarkus.log.level=WARN

# Port de test dedie : 8081, le defaut de Quarkus, est deja pris par les
# interfaces d'administration du docker-compose (kafka-ui, redis-commander).
quarkus.http.test-port=8111
quarkus.http.test-ssl-port=8443
