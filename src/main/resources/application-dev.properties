# DEVELOPMENT PROFILE

# DATASOURCE
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/cyberas
quarkus.datasource.username=cyberas
quarkus.datasource.password=cyberas_dev_password

# HIBERNATE
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# REDIS
quarkus.redis.hosts=redis://localhost:6379

# LOGGING
quarkus.log.level=DEBUG
quarkus.log.console.level=DEBUG

# Limites assouplies en développement : trois inscriptions par heure protègent la
# production mais rendent tout essai impossible en local. Les valeurs de
# production restent celles d'application.properties.
rate-limit.login.max=100
rate-limit.login.window-seconds=60
rate-limit.register.max=50
rate-limit.register.window-seconds=60
rate-limit.api.max=1000
rate-limit.api.window-seconds=60
