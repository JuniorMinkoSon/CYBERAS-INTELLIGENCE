# DEVELOPMENT PROFILE

# DATASOURCE
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/cyberas
quarkus.datasource.username=cyberas
quarkus.datasource.password=cyberas_dev_password

# HIBERNATE
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# KAFKA
kafka.bootstrap.servers=localhost:9092

# REDIS
quarkus.redis.hosts=redis://localhost:6379

# LOGGING
quarkus.log.level=DEBUG
quarkus.log.console.level=DEBUG

# DEV SERVICES - Auto-start containers for local development
quarkus.devservices.enabled=true
quarkus.devservices.service-name=cyberas
quarkus.devservices.container.port-mappings=5432:5432,9092:9092,6379:6379
