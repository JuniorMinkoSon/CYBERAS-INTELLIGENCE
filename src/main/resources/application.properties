# APPLICATION
quarkus.application.name=cyberas-audit-service
quarkus.application.version=1.0.0

# SERVER
# Les plateformes d'hébergement (Render, etc.) imposent leur propre port via PORT.
# 8081 reste la valeur de développement local.
quarkus.http.port=${PORT:8081}
# Toutes les ressources REST sont servies sous /api : le frontend cible ce prefixe.
quarkus.rest.path=/api
quarkus.http.host=0.0.0.0

# CORS Configuration (via CorsFilter)
# Allowed origins (dev defaults: localhost + 127.0.0.1 on port 5173 & 3000)
# Production: set via environment variable CORS_ORIGINS
# Les origines de production figurent dans la valeur par défaut, et pas
# seulement dans une variable d'environnement. Une variable oubliée à
# l'hébergement ne provoque aucune erreur au démarrage : le navigateur bloque
# simplement chaque réponse, et l'application ne voit qu'un échec réseau. Faire
# dépendre l'accès au service d'un réglage dont l'absence est silencieuse
# revient à programmer la panne.
#
# Pas de joker « https://*.vercel.app » : il autorisait n'importe quelle
# application hébergée chez Vercel à appeler l'API depuis le navigateur d'un
# visiteur connecté. Les prévisualisations se déclarent une à une dans
# CORS_ORIGINS, qui reste prioritaire pour ajouter un domaine sans reconstruire.
cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://cyberas-intelligence-delta.vercel.app}
cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.headers=Content-Type,Authorization,X-Requested-With
# L'API s'authentifie par jeton porteur dans l'en-tête Authorization, jamais
# par cookie : autoriser les identifiants n'apportait rien et élargissait
# ce qu'une origine acceptée pouvait faire.
cors.credentials=false
cors.max-age=3600

# Jetons : l'accès expire en une heure, le rafraîchissement en sept jours.
# Un jeton d'accès de 24 h volé (script injecté, poste partagé) restait
# utilisable une journée entière.
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
jwt.refresh-expiration-minutes=${JWT_REFRESH_EXPIRATION_MINUTES:10080}

# HSTS seulement en production : l'API locale est servie en clair, et un HSTS
# mémorisé par le navigateur bloquerait ensuite tout accès HTTP à localhost.
security.hsts=false
%prod.security.hsts=true

# Clé de chiffrement des colonnes sensibles (commentaires du questionnaire,
# sortie brute des scans) : 32 octets en base64, hors de la base. Absente, les
# colonnes sont écrites en clair et un avertissement est journalisé — mode de
# développement seulement. Générer : openssl rand -base64 32
cyberas.data-key=${CYBERAS_DATA_KEY:}

# Rate Limiting Configuration
# Login endpoint protection (5 attempts per 15 minutes per IP)
rate-limit.login.max=${RATE_LIMIT_LOGIN_MAX:5}
rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW:900}
# Register endpoint protection (3 attempts per hour per IP)
rate-limit.register.max=${RATE_LIMIT_REGISTER_MAX:3}
rate-limit.register.window-seconds=${RATE_LIMIT_REGISTER_WINDOW:3600}
# API endpoint protection (100 requests per minute per user/IP)
rate-limit.api.max=${RATE_LIMIT_API_MAX:100}
rate-limit.api.window-seconds=${RATE_LIMIT_API_WINDOW:60}

# DATASOURCE - PostgreSQL
quarkus.datasource.db-kind=postgresql
# URL cadrée par profil : en test elle reste absente, ce qui laisse les Dev Services
# démarrer une PostgreSQL jetable au lieu de viser une base locale inexistante.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/cyberas
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/cyberas}
# Identifiants : valeurs de développement par défaut, surchargées par l'environnement
# en production. Aucun secret réel ne doit figurer dans ce fichier.
quarkus.datasource.username=${DB_USERNAME:cyberas}
quarkus.datasource.password=${DB_PASSWORD:cyberas_dev_password}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.initial-size=2
quarkus.datasource.jdbc.acquisition-timeout=10s

# HIBERNATE - ORM
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.packages=com.cyberas.domain
# Les entités nomment leurs champs en camelCase, les migrations leurs colonnes en
# snake_case. Sans cette stratégie, un @Column sans attribut name fait chercher à
# Hibernate le nom du champ tel quel — d'où des colonnes  « introuvables » qui
# existent pourtant.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.jdbc.batch-size=10
quarkus.hibernate-orm.jdbc.batch-versioned-data=true
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false
quarkus.hibernate-orm.mapping.format.global=ignore

# DEV PROFILE OVERRIDES
%dev.quarkus.hibernate-orm.database.generation=validate
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.bind-parameters=true
%dev.quarkus.log.level=DEBUG
%dev.quarkus.log.console.level=DEBUG

# FLYWAY - Database Migrations
# Flyway produit le schéma, y compris en développement : sans cela Hibernate le
# génère à sa façon et l'on perd les contraintes CHECK, les index partiels et les
# index uniques conditionnels que portent les migrations.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.schemas=public
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# JWT / SECURITY
mp.jwt.verify.issuer=https://cyberas-audit-service
mp.jwt.verify.audiences=cyberas
quarkus.smallrye-jwt.sign.key-location=privateKey.pem
quarkus.smallrye-jwt.enabled=true

# OIDC (Optional - for future integration)
quarkus.oidc.enabled=false

# REDIS
# REDIS_HOSTS est renseigné par l'hébergeur ; la valeur locale sert de repli.
quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.client-type=standalone
quarkus.redis.timeout=10s

# KAFKA MESSAGING
# KAFKA_BOOTSTRAP_SERVERS est renseigné par l'hébergeur ; la valeur locale
# pointe sur le service kafka de docker-compose.yml.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Scan Events Topic — télémétrie de scan, un message par étape (soumission,
# sonde TCP, sonde UDP, constat, fin). `scan-events` (entrant) est le canal
# consommé par la cartographie des risques ; `scan-telemetry` (sortant) est
# celui par lequel CYBERAS publie ses propres étapes sur CE MÊME topic Kafka,
# afin qu'un autre service abonné (moteur ML, SIEM externe) les reçoive sans
# dépendre de cette application. Un service ne peut pas être à la fois entrant
# et sortant sur un même nom de canal, d'où les deux déclarations.
# Adresse réelle de l'appelant derrière un proxy.
#
# L'application est servie derrière un routeur d'hébergeur : sans ce réglage,
# Vert.x voit l'adresse du proxy et non celle du client, et la limitation de
# débit compte alors toutes les requêtes du monde dans un même seau.
#
# Activé ici plutôt que lu à la main dans un filtre : Vert.x n'applique
# l'en-tête que sur cette instruction explicite, ce qui veut dire qu'un client
# qui pose lui-même X-Forwarded-For ne peut rien obtenir tant que la
# configuration ne dit pas qu'un proxy de confiance se trouve devant. Le lire
# sans condition, comme le faisait le filtre, laissait n'importe qui choisir
# son adresse et donc son compteur.
#
# À repasser à false le jour où le service est exposé sans proxy devant lui.
quarkus.http.proxy.proxy-address-forwarding=true

mp.messaging.incoming.scan-events.connector=smallrye-kafka
mp.messaging.incoming.scan-events.topic=cyberas-scan-events
mp.messaging.incoming.scan-events.auto.offset.reset=earliest
mp.messaging.incoming.scan-events.group.id=cyberas-service

mp.messaging.outgoing.scan-telemetry.connector=smallrye-kafka
mp.messaging.outgoing.scan-telemetry.topic=cyberas-scan-events

# Finding Events Topic
mp.messaging.outgoing.finding-events.connector=smallrye-kafka
mp.messaging.outgoing.finding-events.topic=cyberas-finding-events

# Risk Events Topic — mises à jour de la cartographie des risques (MEHARI simplifié).
mp.messaging.outgoing.risk-events.connector=smallrye-kafka
mp.messaging.outgoing.risk-events.topic=cyberas-risk-events

# Audit Events Topic — diffusion best-effort du journal d'audit chaîné
# (AuditTrailService). La table audit_events reste la source de vérité : la
# publication ici est une rediffusion pour analyse externe (SIEM, ML), jamais
# une dépendance de l'écriture elle-même.
mp.messaging.outgoing.audit-events.connector=smallrye-kafka
mp.messaging.outgoing.audit-events.topic=cyberas-audit-events

# =============================================================================
# Services d'analyse externes (Python) — scoring ML et OCR des preuves
#
# Absents ou injoignables, chacun se dégrade sans interrompre l'audit :
# l'OCR bascule sur l'analyseur heuristique (comme Gemini avant lui), et la
# vérification de cohérence ML est simplement omise du rapport.
# =============================================================================
ocr.service.url=${OCR_SERVICE_URL:http://localhost:8500}
ml.service.url=${ML_SERVICE_URL:http://localhost:8600}

# METRICS - Prometheus
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.jvm.enabled=true
quarkus.micrometer.binder.system.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.metrics.enabled=true

# HEALTH CHECKS
quarkus.health.enabled=true
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready

# OPENAPI
quarkus.smallrye-openapi.enable=true
quarkus.swagger-ui.enable=true
quarkus.swagger-ui.path=/q/swagger-ui.html

# LOGGING
quarkus.log.level=INFO
quarkus.log.console.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{1.}] %s%e%n
quarkus.log.file.enable=true
quarkus.log.file.path=logs/cyberas.log
# En production conteneurisée, le disque est éphémère et l'hébergeur collecte
# déjà la sortie standard : écrire un fichier ne servirait qu'à consommer de
# l'espace, et échouerait si le répertoire n'est pas créable.
%prod.quarkus.log.file.enable=false
quarkus.log.file.level=INFO
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{1.}] %s%e%n

# JWT CONFIGURATION
# Secret de signature JWT : la valeur ci-dessous ne vaut que pour le développement.
# En production, JWT_SECRET est obligatoire — voir .env.example.
jwt.secret=${JWT_SECRET:cyberas-audit-service-dev-secret-key-minimum-256-bits-required-for-hs256-production-must-override}
jwt.expiration-minutes=1440
jwt.refresh-expiration-minutes=10080

# DEVELOPMENT
quarkus.devservices.enabled=false
quarkus.devservices.redirection-enabled=false

# =============================================================================
# Connexion par compte Google (OAuth 2.0)
#
# Les identifiants ne figurent JAMAIS ici : ce fichier est versionné. Ils sont
# lus dans l'environnement, ou dans un fichier .env local qui est ignoré par
# git. Une valeur absente désactive proprement la route — une installation qui
# n'utilise pas Google doit démarrer sans.
#
# L'URI de redirection doit être déclarée à l'identique dans la console Google
# (Identifiants → client OAuth → URI de redirection autorisés). Google refuse
# tout retour vers une adresse non déclarée, au caractère près.
# =============================================================================
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/api/auth/google/callback}

# Adresse de l'interface, vers laquelle la connexion renvoie une fois établie.
app.frontend-url=${FRONTEND_URL:http://localhost:5174}

# =============================================================================
# Analyse des pieces justificatives par modele de langage
#
# La cle n'est jamais ecrite ici. Absente, l'analyseur heuristique prend le
# relais : un audit doit pouvoir se derouler sans service externe, et une
# panne du fournisseur ne doit pas interrompre une mission en cours.
# =============================================================================
gemini.api-key=${GEMINI_API_KEY:}
# `gemini-flash-latest` plutot qu'une version figee : les modeles nommes sont
# retires du service apres quelques mois, et un nom fige transforme une
# fonctionnalite qui marche en 404 silencieux. Verifie a l'execution :
# gemini-2.0-flash renvoyait deja « no longer available ».
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
