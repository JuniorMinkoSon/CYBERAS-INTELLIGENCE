# APPLICATION
quarkus.application.name=cyberas-audit-service
quarkus.application.version=1.0.0

# SERVER
quarkus.http.port=8080
# Toutes les ressources REST sont servies sous /api : le frontend cible ce prefixe.
quarkus.rest.path=/api
quarkus.http.host=0.0.0.0

# CORS Configuration (via CorsFilter)
# Allowed origins (dev defaults: localhost + 127.0.0.1 on port 5173 & 3000)
# Production: set via environment variable CORS_ORIGINS
cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.headers=Content-Type,Authorization,X-Requested-With
cors.credentials=true
cors.max-age=3600

# Rate Limiting Configuration
# Login endpoint protection (5 attempts per 15 minutes per IP)
rate-limit.login.max=${RATE_LIMIT_LOGIN_MAX:5}
rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW:900}
# Register endpoint protection (3 attempts per hour per IP)
rate-limit.register.max=${RATE_LIMIT_REGISTER_MAX:3}
rate-limit.register.window-seconds=${RATE_LIMIT_REGISTER_WINDOW:3600}
# API endpoint protection (100 requests per minute per user/IP)
rate-limit.api.max=${RATE_LIMIT_API_MAX:100}
rate-limit.api.window-seconds=${RATE_LIMIT_API_WINDOW:60}

# DATASOURCE - PostgreSQL
quarkus.datasource.db-kind=postgresql
# URL cadrée par profil : en test elle reste absente, ce qui laisse les Dev Services
# démarrer une PostgreSQL jetable au lieu de viser une base locale inexistante.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/cyberas
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/cyberas}
# Identifiants : valeurs de développement par défaut, surchargées par l'environnement
# en production. Aucun secret réel ne doit figurer dans ce fichier.
quarkus.datasource.username=${DB_USERNAME:cyberas}
quarkus.datasource.password=${DB_PASSWORD:cyberas_dev_password}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.initial-size=2
quarkus.datasource.jdbc.acquisition-timeout=10s

# HIBERNATE - ORM
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.packages=com.cyberas.domain
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.jdbc.batch-size=10
quarkus.hibernate-orm.jdbc.batch-versioned-data=true
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false

# FLYWAY - Database Migrations
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.schemas=public
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# JWT / SECURITY
mp.jwt.verify.issuer=https://cyberas-audit-service
mp.jwt.verify.audiences=cyberas
quarkus.smallrye-jwt.sign.key-location=privateKey.pem
quarkus.smallrye-jwt.enabled=true

# OIDC (Optional - for future integration)
quarkus.oidc.enabled=false

# REDIS
quarkus.redis.hosts=localhost:6379
quarkus.redis.client-type=standalone
quarkus.redis.timeout=10s

# KAFKA MESSAGING
kafka.bootstrap.servers=localhost:9092

# Scan Events Topic
mp.messaging.incoming.scan-events.connector=smallrye-kafka
mp.messaging.incoming.scan-events.topic=cyberas-scan-events
mp.messaging.incoming.scan-events.auto.offset.reset=earliest
mp.messaging.incoming.scan-events.group.id=cyberas-service

# Finding Events Topic
mp.messaging.outgoing.finding-events.connector=smallrye-kafka
mp.messaging.outgoing.finding-events.topic=cyberas-finding-events

# Risk Events Topic
mp.messaging.outgoing.risk-events.connector=smallrye-kafka
mp.messaging.outgoing.risk-events.topic=cyberas-risk-events

# Audit Events Topic
mp.messaging.outgoing.audit-events.connector=smallrye-kafka
mp.messaging.outgoing.audit-events.topic=cyberas-audit-events

# METRICS - Prometheus
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.jvm.enabled=true
quarkus.micrometer.binder.system.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.metrics.enabled=true

# HEALTH CHECKS
quarkus.health.enabled=true
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready

# OPENAPI
quarkus.smallrye-openapi.enable=true
quarkus.swagger-ui.enable=true
quarkus.swagger-ui.path=/q/swagger-ui.html

# LOGGING
quarkus.log.level=INFO
quarkus.log.console.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{1.}] %s%e%n
quarkus.log.file.enable=true
quarkus.log.file.path=logs/cyberas.log
quarkus.log.file.level=INFO
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{1.}] %s%e%n

# JWT CONFIGURATION
# Secret de signature JWT : la valeur ci-dessous ne vaut que pour le développement.
# En production, JWT_SECRET est obligatoire — voir .env.example.
jwt.secret=${JWT_SECRET:cyberas-audit-service-dev-secret-key-minimum-256-bits-required-for-hs256-production-must-override}
jwt.expiration-minutes=1440
jwt.refresh-expiration-minutes=10080

# DEVELOPMENT
quarkus.devservices.enabled=false
quarkus.devservices.redirection-enabled=false
