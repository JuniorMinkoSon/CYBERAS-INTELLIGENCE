# ============================================
# CYBERAS Application Configuration
# Environment-specific values override defaults
# ============================================

# ---- Server ----
quarkus.http.port=8080
quarkus.application.name=cyberas-audit-service
quarkus.application.version=1.0.0-SNAPSHOT

# ---- Database (PostgreSQL) ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=cyberas
quarkus.datasource.password=${POSTGRES_PASSWORD:cyberas-dev-password}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/cyberas
quarkus.datasource.jdbc.max-size=20

# ---- Hibernate/JPA ----
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQL10Dialect

# ---- Flyway Database Migrations ----
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# ---- Redis (Token Blacklist + Cache) ----
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
quarkus.redis.max-pool-size=10

# ---- Kafka ----
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.default-kafka-broker=localhost:9092

# ---- JWT/Security ----
cyberas.jwt.secret=${CYBERAS_JWT_SECRET:dev-secret-key-minimum-32-chars-long-not-for-production}
cyberas.password.min-length=12
cyberas.password.require-uppercase=true
cyberas.password.require-lowercase=true
cyberas.password.require-digits=true
cyberas.password.require-special-chars=true

# ---- Rate Limiting ----
cyberas.auth.login.max-attempts=5
cyberas.auth.login.attempt-window-minutes=5
cyberas.auth.signup.max-attempts=10
cyberas.auth.signup.attempt-window-hours=1

# ---- CORS ----
quarkus.http.cors=true
quarkus.http.cors.origins=https://cyberas.local,https://www.cyberas.local,http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Correlation-ID
quarkus.http.cors.max-age=3600
quarkus.http.cors.credentials=true

# ---- Security Headers ----
quarkus.http.header.X-Content-Type-Options.value=nosniff
quarkus.http.header.X-Frame-Options.value=DENY
quarkus.http.header.X-XSS-Protection.value=1; mode=block
quarkus.http.header.Strict-Transport-Security.value=max-age=31536000; includeSubDomains

# ---- Email Configuration ----
quarkus.mailer.host=${QUARKUS_MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${QUARKUS_MAILER_PORT:587}
quarkus.mailer.username=${QUARKUS_MAILER_USERNAME:}
quarkus.mailer.password=${QUARKUS_MAILER_PASSWORD:}
quarkus.mailer.from=${QUARKUS_MAILER_FROM:noreply@cyberas.local}
quarkus.mailer.start-tls=REQUIRED

# ---- Logging ----
quarkus.log.level=INFO
quarkus.log.category."com.cyberas".level=DEBUG
quarkus.log.category."io.quarkus.security".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# ---- Metrics ----
quarkus.micrometer.enabled=true
quarkus.micrometer.registry.prometheus.enabled=true
quarkus.micrometer.metrics.enabled=true

# ---- Health Checks ----
quarkus.health.enabled=true
quarkus.smallrye-health.root-path=/q/health

# ---- OpenAPI/Swagger ----
quarkus.smallrye-openapi.info-title=CYBERAS Audit Service API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Plateforme d'audit et conformité assistée par IA
quarkus.swagger-ui.enable=true
quarkus.swagger-ui.path=/q/swagger-ui

# ---- Profiles ----
%dev.quarkus.log.level=DEBUG
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/cyberas
%dev.quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173

%prod.quarkus.log.level=WARN
%prod.quarkus.http.ssl.certificate.key-store-file=${CYBERAS_KEYSTORE:}
%prod.quarkus.http.ssl.certificate.key-store-password=${CYBERAS_KEYSTORE_PASSWORD:}
