# ============================================
# PHASE 0: Security Configuration (Week 1-2)
# ============================================

# ---- JWT Configuration (CRITICAL FIX #1) ----
# MUST be injected from environment variable, NOT hardcoded
# Usage: export CYBERAS_JWT_SECRET="your-secret-key-minimum-32-chars"
mp.jwt.verify.issuer=https://cyberas.local
mp.jwt.verify.audiences=cyberas-api
quarkus.smallrye-jwt.sign.key-location=file:${CYBERAS_JWT_SECRET:dev-secret-key-minimum-32-chars-long}

# ---- Password Policy (CRITICAL FIX #6) ----
cyberas.password.min-length=12
cyberas.password.require-uppercase=true
cyberas.password.require-lowercase=true
cyberas.password.require-digits=true
cyberas.password.require-special-chars=true

# ---- Rate Limiting (CRITICAL FIX #3) ----
# Global rate limit: 100 requests per minute
quarkus.rate-limiting.enabled=true
quarkus.rate-limiting.requests-per-minute=100

# Login rate limit: 5 attempts per 5 minutes per IP
cyberas.auth.login.max-attempts=5
cyberas.auth.login.attempt-window-minutes=5

# Signup rate limit: 10 attempts per hour per IP
cyberas.auth.signup.max-attempts=10
cyberas.auth.signup.attempt-window-hours=1

# ---- CORS Configuration (CRITICAL FIX #4) ----
quarkus.http.cors=true
quarkus.http.cors.origins=https://cyberas.local,https://www.cyberas.local,http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-CSRF-Token
quarkus.http.cors.max-age=3600
quarkus.http.cors.credentials=true

# ---- Security Headers ----
quarkus.http.header.X-Content-Type-Options.value=nosniff
quarkus.http.header.X-Frame-Options.value=DENY
quarkus.http.header.X-XSS-Protection.value=1; mode=block
quarkus.http.header.Strict-Transport-Security.value=max-age=31536000; includeSubDomains

# ---- HTTPS (Phase 1) ----
quarkus.http.ssl.certificate.key-store-file=${CYBERAS_KEYSTORE:}
quarkus.http.ssl.certificate.key-store-password=${CYBERAS_KEYSTORE_PASSWORD:}

# ---- Redis Configuration (for token blacklist) ----
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.max-pool-size=10

# ---- Logout Configuration ----
cyberas.auth.token-blacklist.enabled=true
cyberas.auth.token-blacklist.redis-key-prefix=token:blacklist:

# ---- Email Verification ----
cyberas.email.verification-code-expiry-minutes=30
cyberas.email.resend-cooldown-seconds=60

# ---- Logging ----
quarkus.log.level=INFO
quarkus.log.category."com.cyberas".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# ---- Metrics ----
quarkus.micrometer.enabled=true
quarkus.micrometer.registry.prometheus.enabled=true

# ---- Health Checks ----
quarkus.health.enabled=true
quarkus.smallrye-health.root-path=/q/health
