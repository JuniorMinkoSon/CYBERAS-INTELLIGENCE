# ============================================
# PHASE 2: Kafka Configuration
# Topics for CYBERAS Event-Driven Architecture
# ============================================

# ---- Kafka Broker ----
kafka.bootstrap.servers=localhost:9092
kafka.client.id=cyberas-service
kafka.group.id=cyberas-consumers

# ---- Topic: mission.created ----
# Event: New mission created by RSSI
# Consumers: Notifications, Metrics, Audit
mp.messaging.outgoing.mission-created.connector=smallrye-kafka
mp.messaging.outgoing.mission-created.topic=mission.created
mp.messaging.outgoing.mission-created.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.mission-created.partition=0

# ---- Topic: mission.started ----
mp.messaging.outgoing.mission-started.connector=smallrye-kafka
mp.messaging.outgoing.mission-started.topic=mission.started
mp.messaging.outgoing.mission-started.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---- Topic: mission.completed ----
mp.messaging.outgoing.mission-completed.connector=smallrye-kafka
mp.messaging.outgoing.mission-completed.topic=mission.completed
mp.messaging.outgoing.mission-completed.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---- Topic: questionnaire.answered ----
# Event: Auditor submitted questionnaire responses
mp.messaging.outgoing.questionnaire-answered.connector=smallrye-kafka
mp.messaging.outgoing.questionnaire-answered.topic=questionnaire.answered
mp.messaging.outgoing.questionnaire-answered.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---- Topic: finding.detected ----
# Event: Security finding created
# Consumers: Risk scoring, CEO alerts
mp.messaging.outgoing.finding-detected.connector=smallrye-kafka
mp.messaging.outgoing.finding-detected.topic=finding.detected
mp.messaging.outgoing.finding-detected.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---- Topic: report.generated ----
# Event: Audit report generated
mp.messaging.outgoing.report-generated.connector=smallrye-kafka
mp.messaging.outgoing.report-generated.topic=report.generated
mp.messaging.outgoing.report-generated.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---- Topic: audit-trail ----
# Event: All user actions (login, create mission, etc)
# Consumers: Compliance logs, Security monitoring
mp.messaging.outgoing.audit-trail.connector=smallrye-kafka
mp.messaging.outgoing.audit-trail.topic=audit-trail
mp.messaging.outgoing.audit-trail.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.audit-trail.partition.strategy=io.quarkus.kafka.client.serialization.JsonbSerializer

# ---- Topic: notifications ----
# Event: Generic notifications (email, WhatsApp, SMS)
mp.messaging.outgoing.notifications.connector=smallrye-kafka
mp.messaging.outgoing.notifications.topic=notifications
mp.messaging.outgoing.notifications.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---- Consumer Configuration ----
mp.messaging.incoming.audit-trail-consumer.connector=smallrye-kafka
mp.messaging.incoming.audit-trail-consumer.topic=audit-trail
mp.messaging.incoming.audit-trail-consumer.group.id=cyberas-audit-consumer
mp.messaging.incoming.audit-trail-consumer.auto.offset.reset=earliest

mp.messaging.incoming.notifications-consumer.connector=smallrye-kafka
mp.messaging.incoming.notifications-consumer.topic=notifications
mp.messaging.incoming.notifications-consumer.group.id=cyberas-notifications-consumer
mp.messaging.incoming.notifications-consumer.auto.offset.reset=earliest

# ---- Retention & Performance ----
# Mission events: 30 days
# Audit trail: 365 days (compliance)
# Notifications: 7 days

# ---- Error Handling ----
# Dead Letter Queue Topics (for failed messages)
mp.messaging.incoming.audit-trail-consumer.dead-letter-topic=audit-trail-dlq
mp.messaging.incoming.notifications-consumer.dead-letter-topic=notifications-dlq

# ---- Partitioning Strategy ----
# mission.* → partition by missionId
# audit-trail → partition by userId
# notifications → partition by recipientId

# ---- Schema Registry (Optional, Phase 2+) ----
# schema.registry.url=http://localhost:8081
